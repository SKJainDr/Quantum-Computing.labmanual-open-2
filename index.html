<body data-theme="light">

<a class="skip-link" href="#main">Skip to reading pane</a>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="assets/icons/icon-192.png" width="34" height="34" alt="Quantum Computing Laboratory Manual II logo" style="display:block;border-radius:8px;">
      </div>
      <div class="brand-text">
        <p class="brand-eyebrow">Q. C. Series · Lab Companion to Vol. II</p>
        <h1 class="brand-title">Quantum Computing Lab Manual II</h1>
        <p class="brand-author">Dr. S. K. Jain</p>
      </div>
    </div>

    <div class="sidebar-search">
      <input type="search" id="chapterFilter" placeholder="Filter chapters…" aria-label="Filter chapters">
    </div>

    <nav class="chapter-nav" id="chapterNav" aria-label="Table of contents">
      <!-- injected by app.js -->
    </nav>

    <div class="series-links" id="seriesLinks"></div>

    <div class="sidebar-footer">
      <p>M.Sc. Physics · Experiments 16&ndash;30 · IBM Quantum Hardware</p>
      <p class="visitor-counter">👁 <span id="visitorCount">–</span> visitors</p>
    </div>
  </aside>

  <button class="sidebar-toggle" id="sidebarToggle" aria-expanded="false" aria-controls="sidebar" aria-label="Toggle table of contents">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>

  <!-- ============ MAIN ============ -->
  <div class="main-col">

    <header class="topbar">
      <div class="topbar-left">
        <p class="reading-label" id="chapterLabel">Loading…</p>
      </div>

      <div class="topbar-right">

        <button id="likeBtn" class="tool-btn like-btn" aria-label="Like this book" title="Like this book">
          <svg id="iconHeart" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 21s-7.5-4.6-10-9.2C0.3 8.4 2 4.5 5.8 4.5c2.1 0 3.6 1.1 4.5 2.3.4.5.9.9 1.7.9s1.3-.4 1.7-.9c.9-1.2 2.4-2.3 4.5-2.3C21.9 4.5 23.6 8.4 22 11.8 19.5 16.4 12 21 12 21z" stroke="currentColor" stroke-width="1.8" fill="none"/>

          <span id="likeCount" class="like-count">–</span>
        </button>

        <div class="read-aloud" id="readAloud" title="Click any paragraph in the text to start reading from that point">
          <button id="playBtn" class="tool-btn" aria-label="Read chapter aloud" title="Read aloud (click any paragraph to start from there)">
            <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 5v14l12-7L7 5z" fill="currentColor"/></svg>
            <svg id="iconPause" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/></svg>
          </button>
          <button id="stopBtn" class="tool-btn" aria-label="Stop reading" title="Stop">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
          </button>
          <select id="rateSelect" class="tool-btn rate-select" aria-label="Reading speed" title="Reading speed">
            <option value="0.8">0.8×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
          </select>
        </div>

        <button id="themeToggle" class="tool-btn theme-toggle" aria-label="Toggle light and dark theme" title="Toggle theme">
          <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></g></svg>
          <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div class="reading-progress" aria-hidden="true"><div class="reading-progress-bar" id="progressBar"></div></div>

    <main id="main" class="content-col" tabindex="-1">
      <article id="chapterContent" class="prose">
        <p class="loading-msg">Opening the book…</p>
      </article>

      <nav class="chapter-pager" id="chapterPager" aria-label="Chapter navigation"></nav>
    </main>
  </div>

  <!-- ============ ON-PAGE TOC ============ -->
  <aside class="page-toc" id="pageToc" aria-label="On this page">
    <p class="page-toc-title">On this page</p>
    <div id="pageTocList"></div>
